components:
  parameters:
    Cursor:
      in: query
      name: cursor
      description: The URL returned in `next` or `previous` used to retrieve another [page](/api-guide/overview#pagination) of results.
      schema:
        type: string
    FromCreatedAt:
      in: query
      name: from_created_at
      description: Filter for webhooks created on or after this timestamp.
      schema:
        type: string
        format: date-time
    Limit_webhooks:
      in: query
      name: limit
      description: 'Number of webhook subscriptions returned [per page](/api-guide/overview#pagination). Default: 10. Maximum: 200.'
      schema:
        type: integer
        default: 10
        maximum: 200
    ToCreatedAt:
      in: query
      name: to_created_at
      description: Filter for webhooks created on or before this timestamp.
      schema:
        type: string
        format: date-time
    Ordering:
      in: query
      name: ordering
      description: Use `id` to order results by webhook ID. Use `created_at` to order results by when the webhooks were created.
      schema:
        type: string
        enum:
        - id
        - created_at
  schemas:
    WebhookCreateRequest:
      type: object
      properties:
        events:
          type: array
          description: Webhook events to include in the webhook subscription.
          items:
            type: string
        name:
          type: string
          description: Your name for the webhook subscription.
        url:
          type: string
          format: uri
          description: Where you want to receive webhook delivery. This can be either a backend URL that you manage, or a URL provided by a webhook management service. Argyle handles URL encoding for webhook URLs. Send the URL in its normal, unencoded form.
        secret:
          type: string
          description: Optional secret used to [verify webhooks](/api-guide/webhooks#verifying-webhooks).
        config:
          type: object
          description: Optional event-specific configuration for the webhook subscription. (*Only applicable to certain webhooks*)
          additionalProperties: true
      required:
      - events
      - name
      - url
      example:
        events:
        - verifications.updated
        name: name-for-the-webhook-subscription
        url: https://your-webhook-backend.com
        secret: optional-secret
    ConsolidatedWebhookSubscriptionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the webhook subscription.
        name:
          type: string
          description: Name of the webhook subscription.
        events:
          type: array
          description: Webhook events included in the webhook subscription.
          items:
            type: string
        config:
          type: object
          description: Event-specific configuration for the webhook subscription.
          additionalProperties: true
        secret:
          type:
          - string
          - 'null'
          description: Secret used to verify webhooks, if provided.
        url:
          type: string
          format: uri
          description: URL where webhook deliveries are sent.
        created_at:
          type: string
          format: date-time
          description: Time when the webhook subscription was created.
        updated_at:
          type: string
          format: date-time
          description: Time when the webhook subscription was last updated.
        last_sent_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last time Argyle sent the webhook. A null value means the webhook has not been sent.
      example:
        id: 205c027e-8a4d-4248-b395-d4f345dfd49f
        name: name-for-the-webhook-subscription
        events:
        - verifications.updated
        config: {}
        secret: optional-secret
        url: https://your-webhook-backend.com
        created_at: '2026-07-29T19:33:16.120Z'
        updated_at: '2026-07-29T19:33:16.123Z'
        last_sent_at: null
    ConsolidatedWebhookEventPayload:
      type: object
      description: Webhook event payload. Use `event` to determine the event-specific shape of `data`.
      properties:
        event:
          type: string
          description: Webhook event name.
          enum:
          - users.fully_synced
          - accounts.added
          - accounts.updated
          - accounts.removed
          - accounts.connected
          - accounts.failed
          - items.updated
          - items.removed
          - identities.added
          - identities.updated
          - paystubs.added
          - paystubs.updated
