paths:
  /webhooks:
    post:
      summary: Create a webhook
      description: Creates a webhook subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsolidatedWebhookSubscriptionRequest'
            examples:
              basic:
                summary: Basic subscription
                value:
                  events:
                  - accounts.added
                  name: name-for-the-webhook-subscription
                  url: https://your-webhook-backend.com
                  secret: optional-secret
              include_resource:
                summary: Account resource included
                value:
                  events:
                  - accounts.added
                  name: name-for-the-webhook-subscription
                  url: https://your-webhook-backend.com
                  secret: optional-secret
                  config:
                    include_resource: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidatedWebhookSubscriptionResponse'
              example:
                id: 205c027e-8a4d-4248-b395-d4f345dfd49f
