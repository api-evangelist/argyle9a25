          - gigs.removed
          - gigs.partially_synced
          - gigs.fully_synced
          - vehicles.added
          - vehicles.updated
          - vehicles.removed
          - ratings.added
          - ratings.updated
          - reports.ready
          - reports.generated
          - user_uploads.added
          - user_uploads.removed
          - user_uploads.ocr_completed
          - user_uploads.ocr_failed
          - user_uploads.ocr_authenticity
          - user_forms.removed
          - user_forms.submitted
          - verifications.updated
          - verifications.creation_failed
          - verifications.connection_added
        name:
          type: string
          description: Webhook subscription name.
        data:
          type: object
          description: Event-specific payload object.
          additionalProperties: true
      required:
      - event
      - name
      - data
    WebhookListResponse:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
          format: uri
          description: URL for the next page of results, if available.
        previous:
          type:
          - string
          - 'null'
          format: uri
          description: URL for the previous page of results, if available.
        results:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
    ConsolidatedWebhookSubscriptionRequest:
      type: object
      properties:
        events:
          type: array
          description: Webhook events to include in the webhook subscription.
          items:
            type: string
            enum:
            - users.fully_synced
            - accounts.added
            - accounts.updated
            - accounts.removed
            - accounts.connected
            - accounts.failed
