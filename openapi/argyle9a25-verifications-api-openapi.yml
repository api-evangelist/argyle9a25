  /verifications/{id}/cancel:
    post:
      summary: Cancel a verification
      description: 'Cancels a verification order.


        Only verifications in the `PAUSED` state can be cancelled.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the verification to be cancelled.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientVerification'
              example:
                id: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                created_at: '2023-03-09T16:22:06.081Z'
                updated_at: '2023-03-09T16:22:06.081Z'
                channel: api
                status:
                  state: CANCELLED
                  code: cancelled_by_client
                  errors: []
                report:
                  id: null
                  type: doc-voi-mortgage
                  file_url: null
                  json_url: null
                employments:
                - employer: Warehouse Services Inc
                  status: active
                  hire_date: '2023-02-01'
                  termination_date: null
                loan:
                  number: '1234'
                  borrower_id: ABC789
                  application_id: '2121313'
                  officer_email: john.doe@mortgage.com
                  division: wholesale
                billing:
                  cost_center: '5'
                data_source: documents
      operationId: postVerificationsByIdCancel
      tags:
      - Verifications
components:
  schemas:
    ClientVerification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique ID of the verification.
        user:
          type: string
          format: uuid
          description: ID of the user associated with the verification.
        created_at:
          type: string
          format: date-time
          description: Timestamp ([ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)) when the verification was requested.
        updated_at:
          type: string
          format: date-time
          description: Timestamp ([ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)) when the verification object was last updated.
        channel:
          type: string
          enum:
          - api
          - encompass
          example: api
          description: Origin of the verification order.
        status:
          $ref: '#/components/schemas/ClientVerificationStatus'
        report:
          $ref: '#/components/schemas/ClientVerificationReport'
        employments:
          type: array
          description: List of employments for the user. Documents only.
          items:
            $ref: '#/components/schemas/ClientVerificationEmployment'
        loan:
          $ref: '#/components/schemas/ClientVerificationLoan'
        billing:
          $ref: '#/components/schemas/ClientVerificationBilling'
        configuration:
          $ref: '#/components/schemas/ClientVerificationConfiguration'
        data_source:
          type: string
          enum:
          - payroll
          - banking
          - documents
          description: Source of verification data.
    ClientVerificationLoanCreateRequest:
      allOf:
      - $ref: '#/components/schemas/ClientVerificationLoanMetadata'
      - type: object
        properties:
          division:
            type:
            - string
            - 'null'
            enum:
            - wholesale
            - retail
            default: retail
            description: Loan division. Defaults to `retail` when omitted or `null`. Cannot be changed after the verification is ordered.
    ClientVerificationRefreshRequest:
      type: object
      properties:
        user:
          type: string
          format: uuid
          description: User ID for the verification refresh.
        report:
          $ref: '#/components/schemas/ClientVerificationRefreshReportRequest'
        loan:
          $ref: '#/components/schemas/ClientVerificationLoanMetadata'
        billing:
          $ref: '#/components/schemas/ClientVerificationBilling'
      required:
      - user
      - report
    ClientVerificationConfiguration:
      type: object
      properties:
        notified_recipients:
          type:
          - array
          - 'null'
          description: Email addresses that receive client notifications about the verification's progress.
          items:
            type: string
            format: email
    ClientVerificationEmployment:
      type: object
      description: Employment details for the user.
      properties:
        employer:
          type: string
          description: Name of the employer.
        status:
          type: string
          enum:
          - active
          - previous
          description: User's current employment status at this employer.
        hire_date:
          type: string
          format: date
          description: Employment start date in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        termination_date:
          type:
          - string
          - 'null'
          format: date
          description: Employment end date in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format. `null` when employment `status` is `active`.
    ClientVerificationCreateRequest:
      type: object
      description: 'Request body for ordering a verification.


        - `user` and `report` are required for all requests.

        - `employments` is required for document verifications only.

        - `report.configuration` is used for banking verifications only.

        - `loan` and `billing` apply to regular payroll and mortgage verification workflows.'
      properties:
        user:
          type: string
          format: uuid
          description: User ID for the verification.
        employments:
          type: array
          description: 'List of employments for the user.


            Required for document verifications only. Not used for payroll or banking verifications.'
          items:
            $ref: '#/components/schemas/ClientVerificationEmploymentRequest'
        report:
          $ref: '#/components/schemas/ClientVerificationCreateReportRequest'
        loan:
          $ref: '#/components/schemas/ClientVerificationLoanCreateRequest'
        billing:
          $ref: '#/components/schemas/ClientVerificationBilling'
        configuration:
          $ref: '#/components/schemas/ClientVerificationCreateConfiguration'
      required:
      - user
      - report
    ClientVerificationCreateReportRequest:
      type: object
      description: Report request configuration.
      properties:
        type:
          type: string
          enum:
          - voie
          - voe
          - voie-government
          - voa
          - voi
          - voai
          - voe-transactions
          - doc-voi-mortgage
          description: 'The type of report to generate.


            Payroll:

            - `voie` - Verification of Income and Employment.

            - `voe` - Verification of Employment.

            - `voie-government` - Government income verification.


            Banking:

            - `voa` - Banking verification of assets.

            - `voi` - Banking verification of income.

            - `voai` - Banking verification of income and assets.

            - `voe-transactions` - Banking verification of employment.


            Documents:

            - `doc-voi-mortgage` - Mortgage document-based verification of income, integrated with Freddie Mac''s AIM Check.'
        self_certification:
          type:
          - boolean
          - 'null'
          description: 'For `voie-government` reports, controls whether the applicant reviews and confirms income details in Link.


            Set to `true` to enable applicant self-certification, or `false` to skip applicant certification. Defaults to `true` when omitted for `voie-government` reports. Requests that include this field for other report types return a `400` error.

            '
        configuration:
          allOf:
          - $ref: '#/components/schemas/ClientVerificationReportConfiguration'
          - description: Optional banking report configurations.
      required:
      - type
    ClientVerificationLoanMetadata:
      type: object
      description: Optional loan details for regular payroll and mortgage verification workflows.
      properties:
        number:
          type: string
          description: Loan number or identifier.
        borrower_id:
          type: string
          description: Borrower identifier.
        application_id:
          type: string
          description: Application identifier.
        officer_email:
          type: string
          description: Email of the loan officer requesting the verification.
    ClientVerificationError:
      type: object
      description: Verification error details.
      properties:
        code:
          type: string
          description: Error code.
        title:
          type: string
          description: Error title.
        message:
          type: string
          description: Error message.
        resources:
          type: array
          description: Additional troubleshooting resources (for example, the ID of an unmatched document).
          items:
            $ref: '#/components/schemas/ClientVerificationErrorResource'
      example:
        code: self-employed_income
        title: Self-employed income
        message: Self-employed income cannot be assessed using Paystub and W2 Data.
        resources:
        - id: null
          type: employments
          name: Freelance Consulting LLC
    ClientVerificationLoan:
      type: object
      description: Optional loan details for regular payroll and mortgage verification workflows.
      properties:
        number:
          type: string
          description: Loan number or identifier.
        borrower_id:
          type: string
          description: Borrower identifier.
        application_id:
          type: string
          description: Application identifier.
        officer_email:
          type: string
          description: Email of the loan officer requesting the verification.
        division:
          type: string
          enum:
          - wholesale
          - retail
          description: Loan division. Set when the verification is ordered and inherited by reverifications.
    ClientVerificationEmploymentRequest:
      allOf:
      - $ref: '#/components/schemas/ClientVerificationEmployment'
      - type: object
        required:
        - employer
        - status
        - hire_date
    ClientVerificationCreateConfiguration:
      type: object
      properties:
        notified_recipients:
          type:
          - array
          - 'null'
          description: 'Email addresses you want to receive notifications about the verification''s progress. Must be a valid email address.


            If omitted, no client notifications are sent.

            '
          items:
            type: string
            format: email
    ClientVerificationStatus:
      type: object
      description: Verification status information.
      properties:
        state:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - PAUSED
          - CANCELLED
          - COMPLETED
          description: 'Verification state.


            - `PENDING` - Initial status after verification is created.

            - `PROCESSING` - Verification processing is underway.

            - `PAUSED` - Verification is paused because more data or documents are required.

            - `CANCELLED` - Verification has been cancelled.

            - `COMPLETED` - Verification is complete and report assets are available.

            '
        code:
          type: string
          enum:
          - pending
          - invite_sent
          - user_session_started
          - authenticated
          - documents_processing
          - report_available
          - waiting_on_third_party
          - report_generating
          - awaiting_certification
          - connection_attempted
          - more_data_required
          - syncing_error
          - cancelled_by_client
          - system_error
          - argyle_timeout
          - completed
          - completed_with_errors
          description: 'Verification status code.


            <details class="enum-definitions verification-status-codes">

            <summary><span>For payroll, government, and banking report types:</span></summary>


            | `status.state` | `status.code` | Description |

            | --- | --- | --- |

            | `PENDING` | `pending` | Verification created. |

            | `PENDING` | `invite_sent` | Invite sent; waiting for user action. |

            | `PENDING` | `user_session_started` | User opened the payroll or banking connection experience. |

            | `PROCESSING` | `authenticated` | User authenticated for payroll or banking; data aggregation is in progress. |

            | `PROCESSING` | `report_available` | Data and documents are sufficient to complete verification. |

            | `PROCESSING` | `waiting_on_third_party` | Awaiting processing by a third party. |

            | `PROCESSING` | `report_generating` | Report is currently generating. |

            | `PROCESSING` | `awaiting_certification` | awaiting user certification for aggregated government data |

            | `PAUSED` | `connection_attempted` | Account connection was attempted and user action is required to resolve a recoverable error. See [account connection errors](/api-reference/account-connection-errors). |

            | `PAUSED` | `syncing_error` | A syncing error requires user action (such as MFA) before processing can continue. |

            | `CANCELLED` | `cancelled_by_client` | Verification has been cancelled. |

            | `CANCELLED` | `system_error` | Argyle cannot complete the verification because of an unrecoverable system error. |

            | `CANCELLED` | `argyle_timeout` | Verification request has been cancelled by Argyle after 180 days of inactivity. |

            | `COMPLETED` | `completed` | Report is ready for download. |

            | `COMPLETED` | `completed_with_errors` | Verification request completed. Report can be retrieved but may contain deficiencies. |


            </details>


            <details class="enum-definitions verification-status-codes">

            <summary><span>For <strong>doc-voi-mortgage</strong> report types:</span></summary>


            | `status.state` | `status.code` | Description |

            | --- | --- | --- |

            | `PENDING` | `pending` | Verification created. |

            | `PROCESSING` | `documents_processing` | Documents processing. |

            | `PROCESSING` | `report_available` | Data and documents are sufficient to complete verification. |

            | `PROCESSING` | `waiting_on_third_party` | Awaiting processing by a third party. |

            | `PAUSED` | `more_data_required` | More data or documents are needed to complete the verification. |

            | `CANCELLED` | `cancelled_by_client` | Verification has been cancelled. |

            | `CANCELLED` | `argyle_timeout` | Verification request has been cancelled by Argyle after 180 days of inactivity. |

            | `COMPLETED` | `completed` | Verification request complete. Report can be retrieved. |

            | `COMPLETED` | `completed_with_errors` | Verification request completed. Report can be retrieved but is not GSE eligible. |


            </details>'
        errors:
          type: array
          description: 'Error information.


            Error details can explain what caused a `PAUSED` state or prevented GSE eligibility for a `COMPLETED` document verification.

            '
          items:
            $ref: '#/components/schemas/ClientVerificationError'
    ClientVerificationUpdateRequest:
      type: object
      description: 'Request body for updating a verification.


        - `loan` and `billing` can be updated for either data source.

        - `loan.division` cannot be changed.

        - `employments` can only be updated when a document verification is in the `PAUSED` state.

        - Updating `employments` replaces the full employments array.

        '
      properties:
        loan:
          $ref: '#/components/schemas/ClientVerificationLoanMetadata'
        billing:
          $ref: '#/components/schemas/ClientVerificationBilling'
        employments:
          type: array
          description: Updated list of employments for the user.
          items:
            $ref: '#/components/schemas/ClientVerificationEmploymentRequest'
    ClientVerificationBilling:
      type: object
      description: Optional billing details for regular payroll and mortgage verification workflows.
      properties:
        cost_center:
          type: string
          description: Cost center identifier.
    ClientVerificationReportConfiguration:
      type: object
      description: Optional banking report configurations.
      properties:
        bank_accounts:
          type: array
          items:
            type: string
          description: List of [bank account](/api-reference/bank-accounts) IDs to be included in the report.
        from_date:
          type: string
          format: date-time
          description: 'Restrict report to data from on or after this datetime ([ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)).


            - `VOAI` reports - controls the length of asset history

            - `VOA` reports - controls the length of asset history

            - `VOI` reports - controls the length of income history

            '
        income_from_date:
          type: string
          format: date-time
          description: 'Restrict report to data from on or after this datetime ([ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)).


            - `VOAI` reports - controls the length of income history

            - Does not apply to `VOA` or `VOI` reports.

            '
        income_stream_confidence_minimum:
          type: integer
          minimum: 0
          maximum: 100
          description: 'Limit income streams used in the report to those above this confidence value (`0-100` accepted).


            Only available for `VOI` and `VOAI` report types.

            '
        report_custom_fields:
          type: array
          maxItems: 5
          description: Include up to `5` custom objects in the report metadata. Often used for identifying information.
          items:
            $ref: '#/components/schemas/ClientReportCustomField'
    ClientVerificationRefreshReportRequest:
      type: object
      description: Report request configuration for refresh requests.
      properties:
        type:
          type: string
          enum:
          - voie
          - voe
          - voa
          - voi
          - voai
          - voe-transactions
          - doc-voi-mortgage
          description: 'Payroll, banking, or Doc VOI report type to generate.


            Payroll:

            - `voie` - Verification of Income and Employment.

            - `voe` - Verification of Employment.


            Banking:

            - `voa` - Banking verification of assets.

            - `voi` - Banking verification of income.

            - `voai` - Banking verification of income and assets.

            - `voe-transactions` - Banking verification of employment.


            Documents:

            - `doc-voi-mortgage` - Mortgage document-based verification of income, integrated with Freddie Mac''s AIM Check.'
        configuration:
          allOf:
          - $ref: '#/components/schemas/ClientVerificationReportConfiguration'
          - description: Optional banking report configurations.
      required:
      - type
    ClientReportCustomField:
      type: object
      description: Custom field returned in report JSON as a pass-through value.
      properties:
        label:
          type: string
          description: Custom field name.
        value:
          type: string
          description: Custom field value.
        shown:
          type: boolean
          description: Show custom field on report PDF.
    ClientVerificationReport:
      type: object
      description: Report information.
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Unique ID of the report.


            Only available when verification state is `COMPLETED`.

            '
        type:
          type: string
          enum:
          - voie
          - voe
          - voie-government
          - voa
          - voi
          - voai
          - voe-transactions
          - doc-voi-mortgage
          description: 'The type of report.


            Payroll:

            - `voie` - Verification of Income and Employment.

            - `voe` - Verification of Employment.

            - `voie-government` - Government income verification.


            Banking:

            - `voa` - Banking verification of assets.

            - `voi` - Banking verification of income.

            - `voai` - Banking verification of income and assets.

            - `voe-transactions` - Banking verification of employment.


            Documents:

            - `doc-voi-mortgage` - Mortgage document-based verification of income, integrated with Freddie Mac''s AIM Check.'
        self_certification:
          type:
          - boolean
          - 'null'
          description: 'For `voie-government` reports, indicates whether the applicant self-certification flow is enabled in Link.


            Defaults to `true` for `voie-government` reports and `null` for other report types.

            '
        file_url:
          type:
          - string
          - 'null'
          example: www.argyle.com/storagename/pdf
          description: 'Download link to the report PDF.


            Requires [Argyle authentication headers](/api-guide/overview#authentication). Only available when verification state is `COMPLETED`.

            '
        json_url:
          type:
          - string
          - 'null'
          example: www.argyle.com/storagename/json
          description: 'Download link to the report in JSON.


            Requires [Argyle authentication headers](/api-guide/overview#authentication). Only available when verification state is `COMPLETED`.

            '
        configuration:
          $ref: '#/components/schemas/ClientVerificationReportConfiguration'
    ClientVerificationErrorResource:
      type: object
      description: Verification error resource details.
      properties:
        id:
          type:
          - string
          - 'null'
          description: ID of the associated resource, if available.
        type:
          type: string
          description: Resource type.
        name:
          type: string
          description: Resource name.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Username = api_key_id, Password = api_key_secret
