    PartnerInviteSessionInvite:
      type: object
      properties:
        status:
          type: string
          enum:
          - sent
          - initiated
          - attempted
          - completed
          - revoked
          description: 'Invite status. Use verification statuses to determine whether all verifications are complete.


            - `sent` - The invite was sent.

            - `initiated` - The user opened the invite and entered Link, but has not submitted login credentials, uploaded documents, or completed a response form.

            - `attempted` - The user submitted login credentials without connecting an account, or completed only a response form.

            - `completed` - The user connected an account or uploaded a document. Other verifications for the user may still be active.

            - `revoked` - The invite was revoked and its link can no longer be used.

