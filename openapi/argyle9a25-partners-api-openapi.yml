  /partners/v2/receipts:
    servers:
    - url: https://api-sandbox.argyle.com
      description: Sandbox
    - url: https://api.argyle.com
      description: Production
    post:
      summary: Generate a receipt
      description: Returns a PDF listing all billable transactions associated with the user.
      servers:
      - url: https://api.argyle.com
        description: Production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  format: uuid
                  description: ID of the user.
              required:
              - user
            example:
              user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
      responses:
        '200':
          description: ''
          headers:
            Content-Type:
              description: Content type of response payload.
              schema:
                type: string
                example: application/pdf
            Content-Disposition:
              description: Response disposition with receipt filename.
              schema:
                type: string
                example: attachment; filename="receipt.pdf"
            Content-Length:
              description: Size of response payload in bytes.
              schema:
                type: integer
                example: 12345
          content:
            application/pdf:
              schema:
                type: string
                format: binary
              examples:
                default:
                  value: '200 OK

                    Content-Type: application/pdf

                    Content-Disposition: attachment; filename="receipt.pdf"

                    Content-Length: 12345


                    [PDF binary stream omitted]

                    '
      operationId: postPartnersV2Receipts
      tags:
      - Partners
  /partners/v2/sessions:
    servers:
    - url: https://api-sandbox.argyle.com
      description: Sandbox
    - url: https://api.argyle.com
      description: Production
    post:
      summary: Create a session
      description: 'Create a connection session or send an invite.


        - For an embedded session, provide `verification`. The response returns a `link` to launch or embed the frontend experience. The `link` expires after one hour.


        - For an invite, first create the user and at least one active verification. Set `type` to `invite`, provide `user`, and include `configuration.email`, `configuration.phone_number`, or both. The invite link expires after 180 days or when revoked.


        This endpoint is for payroll and banking verifications only.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerSessionCreateRequest'
            examples:
              Embedded - Payroll:
                summary: Embedded - Payroll
                value:
                  verification: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                  configuration:
                    redirect_url: https://your-application.com/return
                    flow_id: 12ABCD3E
                    items:
                    - item_000000001
                    - item_000000002
                    language: EN
                    mobile_app: true
              Embedded - Banking:
                summary: Embedded - Banking
                value:
                  verification: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                  configuration:
                    experience: 97f1eccb-241d-4052-8409-fab9e27a589b
                    single_use_url: false
                    redirect_url: https://your-application.com/return
              Invites:
                summary: Invites
                value:
                  user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                  type: invite
                  configuration:
                    flow_id: 7B18UYWH
                    items: []
                    reply_to: hello@argyle.com
                    email: jane@example.com
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PartnerSession'
                - $ref: '#/components/schemas/PartnerInviteSession'
              examples:
                Embedded - Payroll:
                  summary: Embedded - Payroll
                  value:
                    verification: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                    configuration:
                      experience: null
                      single_use_url: false
                      redirect_url: https://your-application.com/return
                      flow_id: 12ABCD3E
                      items:
                      - item_000000001
                      - item_000000002
                      language: EN
                      mobile_app: true
                    link: https://connect.argyle.com/?...
                    data_source: payroll
                Embedded - Banking:
                  summary: Embedded - Banking
                  value:
                    verification: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                    configuration:
                      experience: 97f1eccb-241d-4052-8409-fab9e27a589b
                      single_use_url: false
                      redirect_url: https://your-application.com/return
                    link: https://connect2.finicity.com?...
                    data_source: banking
                Invites:
                  summary: Invites
                  value:
                    id: c188bce4-8a00-11f1-a41b-2ba97b79663a
                    user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                    type: invite
                    configuration:
                      flow_id: 7B18UYWH
                      items: []
                      reply_to: hello@argyle.com
                      email: jane@example.com
                      phone_number: null
                    link: https://verify.argyle.com/connect/c188bce4-8a00-11f1-a41b-2ba97b79663a?sandbox=1
                    invite:
                      status: sent
                      deliveries:
                      - id: c1acc77e-8a00-11f1-9568-b321cb09ee53
                        method: email
                        status: sent
                        sent_at: '2026-07-27T21:18:47.000Z'
                        updated_at: '2026-07-27T21:18:47.000Z'
                      invited_at: '2026-07-27T21:18:47.000Z'
                      created_at: '2026-07-27T21:18:47.000Z'
                      updated_at: '2026-07-27T21:18:47.000Z'
      operationId: postPartnersV2Sessions
      tags:
      - Partners
  /partners/v2/user-uploads:
    servers:
    - url: https://api-sandbox.argyle.com
      description: Sandbox
    - url: https://api.argyle.com
      description: Production
    post:
      summary: Upload a document
      description: Upload a document via the API.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - user
              - document_type
              - upload
              properties:
                user:
                  type: string
                  format: uuid
                  description: ID of the user object.
                document_type:
                  type: string
                  enum:
                  - paystubs
                  - W-2
                  - 1099
                  - proof-of-identity
                  - proof-of-address
                  - miscellaneous
                  description: The type of document.
                upload:
                  type: string
                  format: binary
                  description: 'Link to the document to be uploaded.


                    Max of 1 file per POST request.

                    '
      responses:
        '200':
          $ref: '#/components/responses/PartnerUserUploadResponse'
      operationId: postPartnersV2UserUploads
      tags:
      - Partners
  /partners/v2/users:
    servers:
    - url: https://api-sandbox.argyle.com
      description: Sandbox
    - url: https://api.argyle.com
      description: Production
    post:
      summary: Create a user
      description: Creates a new user object for partner verification workflows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerUserCreateRequest'
            example:
              client: 39096494-45c8-4fd8-9454-3d1cb2d62db7
              first_name: Jane
              last_name: Doe
              ssn: 000-00-0000
              email: jane@example.com
              phone_number: '+15555555555'
              address:
                city: New York
                line1: 123 Main St
                line2: null
                state: NY
                country: US
                postal_code: null
              birth_date:
                year: 1990
                month: 1
                day: 13
              external_id: null
              external_metadata:
                suppress_verification: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCreateUserResponse'
              example:
                user_token: <SECRET>
                id: 7a614711-066f-4b6b-b319-4c6236b5acc1
      operationId: postPartnersV2Users
      tags:
      - Partners
  /partners/v2/verifications:
    servers:
    - url: https://api-sandbox.argyle.com
      description: Sandbox
    - url: https://api.argyle.com
      description: Production
    post:
      summary: Order a verification
      description: 'Orders a new verification.


